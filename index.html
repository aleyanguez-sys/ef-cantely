const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>{const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayIso=iso(new Date());
function lectivo(s){const d=parse(s).getDay();return d>=1&&d<=5&&!HOL[s]&&s>=START&&s<=END}
/* lista cronológica de clases de un grupo de 4º (sin las suspendidas) */
const _cache={};
function classes(g){
 const sk=(S.skipped[g]||[]).join(',');const ck=g+'|'+sk;if(_cache[ck])return _cache[ck];
 const out=[];let d=START;
 while(d<=END){ if(lectivo(d)){const dw=parse(d).getDay();
   TT.filter(x=>x[0]===dw&&x[3]==='ef'&&x[4]===g).forEach(x=>{ if(!(S.skipped[g]||[]).includes(d+'@'+x[1])) out.push({date:d,start:x[1],end:x[2]}) }) }
   d=addDays(d,1);}
 const off=g[0]==='4'?2:0;
 out.forEach((c,i)=>{c.n=i+1+off; if(g[0]==='1'){ if(c.n<=6){c.sda=3;c.s=c.n}else{c.sda=0;c.s=0} } else if(c.n<=6){c.sda=1;c.s=c.n}else if(c.n<=12){c.sda=2;c.s=c.n-6}else{c.sda=0;c.s=0}});
 _cache[ck]=out;return out}
function classInfo(g,date,start){return classes(g).find(c=>c.date===date&&c.start===start)}
function dayItems(date){
 if(!lectivo(date))return [];
 const dw=parse(date).getDay();
 return TT.filter(x=>x[0]===dw).map(x=>{
   const it={start:x[1],end:x[2],kind:x[3],label:x[4]};
   if(x[3]==='ef'&&GROUPS.includes(x[4])){it.g=x[4];it.skipped=(S.skipped[x[4]]||[]).includes(date+'@'+x[1]);it.ci=it.skipped?null:classInfo(x[4],date,x[1])}
   return it}).sort((a,b)=>a.start.localeCompare(b.start))}

 if(a==='clock'){openClock(D.k);return}
 if(a==='exc'||a==='excg'){UI.sheet={type:'exc',g:D.g}}
 else if(a==='excp'){const E=excGet(D.g);if(E.paid[D.s])delete E.paid[D.s];else E.paid[D.s]=1;save()}
 else if(a==='exconly'){const E=excGet(D.g);E.only=!E.only;save()}
 else if(a==='excxls'){const txt=excCsv(D.m==='1');const fn='excursion-pagados.csv';const msg=document.getElementById('cpy');
   try{if(typeof claude!=='undefined'){const dl=await claude.use('downloads');if(dl){await dl.save({filename:D.m==='1'?fn:'excursion-todos.csv',data:txt});msg.textContent='Listo. Ábrelo con Excel.';return}}}catch(err){}
   try{const f=new File([txt],D.m==='1'?fn:'excursion-todos.csv',{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(err){}
   try{await navigator.clipboard.writeText(txt);msg.textContent='Copiado. Pégalo en una hoja de Excel o Notas.';return}catch(err){}
   msg.innerHTML='Selecciona el texto:<textarea readonly>'+esc(txt)+'</textarea>';return}
 else if(a==='excclr'){const E=excGet(D.g);E.paid={};save()}
 else if(a==='exccopy'){const E=excGet(D.g);const t=(S.roster[D.g]||[]).filter((n,i)=>!E.paid[i]).join('\n');let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(err){}document.getElementById('cpy').innerHTML=ok?'Lista de pendientes copiada.':'Selecciona el texto:<textarea readonly>'+esc(t)+'</textarea>';return}
 else if(a==='tab'){UI.tab=D.v;UI.sheet=null}
 else if(a==='day')UI.date=D.v;
 else if(a==='wk'){let d=addDays(UI.date,+D.v);UI.date=d}
 else if(a==='today')UI.date=null;
 else if(a==='open')UI.sheet={type:'cls',g:D.g,d:D.d,s:D.s};
 else if(a==='osda')UI.sheet={type:'sda',n:+D.n,i:+D.i};
 else if(a==='close')UI.sheet=null;
 else if(a==='done'){S.done[D.k]=!S.done[D.k];save()}
 else if(a==='skip'){(S.skipped[D.g]=S.skipped[D.g]||[]).push(D.k);Object.keys(_cache).forEach(k=>delete _cache[k]);UI.sheet=null;save()}
 else if(a==='unskip'){S.skipped[D.g]=(S.skipped[D.g]||[]).filter(x=>x!==D.k);Object.keys(_cache).forEach(k=>delete _cache[k]);save()}
 else if(a==='att'){S.att=S.att||{};const k=S.att[D.k]=S.att[D.k]||{};if(k[D.s]===+D.v)delete k[D.s];else k[D.s]=+D.v;save()}
 else if(a==='attall'){S.att=S.att||{};const k={};for(let i=0;i<+D.n;i++)k[i]=UI.attLv||3;S.att[D.k]=k;save()}
 else if(a==='exadd'||a==='exsub'){S.ex=S.ex||{};const k=S.ex[D.k]=S.ex[D.k]||{};const e=k[D.s]=k[D.s]||{p:0,n:0};e[D.t]=Math.max(0,(e[D.t]||0)+(a==='exadd'?1:-1));save()}
 else if(a==='attlv'){UI.attLv=+D.v}
 else if(a==='numlv'){UI.numLv=+D.v}
 else if(a==='numall'){const ac=actsFor(UI.evG).find(x=>x.id===UI.evA);const L=UI.numLv==null?5:UI.numLv;(S.roster[UI.evG]||[]).forEach((n,si)=>{const key=UI.evG+'|'+ac.id+'|'+si;const sc=S.scores[key]=S.scores[key]||{};if(D.m==='all'||sc[0]==null)sc[0]=L});save()}
 else if(a==='attclr'){S.att=S.att||{};delete S.att[D.k];save()}
 else if(a==='rub')UI.sheet={type:'rub',id:D.id,g:D.g};
 else if(a==='copyrub'){const ac=actsFor(D.g).find(x=>x.id===D.id);const Dd=RUBD[ac.lv.length];
   const txt=ac.name+' ('+ac.ses+')\nCriterios: '+(ac.c||[]).join(', ')+'\n\n'+ac.inds.map((ind,ii)=>ind+' ['+((ac.ic||[])[ii]||[]).join(', ')+']\n'+Dd.map((t,i)=>'  '+(i+1)+' '+t).join('\n')).join('\n\n');
   let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(err){}
   document.getElementById('cpy').innerHTML=ok?'Copiado.':'No se pudo copiar. Selecciona el texto:<textarea readonly>'+esc(txt)+'</textarea>';return}
 else if(a==='importroster'){const t=document.getElementById('imp').value;let g=null,n=0;const R={};t.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l.startsWith('##')){g=l.replace(/^#+/,'').trim();R[g]=[];return}if(g)R[g].push(l)});
   Object.keys(R).forEach(k=>{if(GROUPS.includes(k)&&R[k].length){S.roster[k]=R[k];n++}});save();render();{const m=document.getElementById('impmsg');if(m)m.textContent=n?('Importadas '+n+' listas.'):'No se ha reconocido ningún grupo. Cada lista debe empezar por una línea como «## 1ºC».'};return}
 else if(a==='goeval'){UI.evG=D.g;UI.tab='eval';UI.sheet=null}
 else if(a==='evg'){UI.evG=D.v;UI.evI=0}
 else if(a==='evi')UI.evI=+D.v;
 else if(a==='sc'){const key=UI.evG+'|'+UI.evA+'|'+D.s;const sc=S.scores[key]=S.scores[key]||{};if(sc[UI.evI]===+D.v)delete sc[UI.evI];else sc[UI.evI]=+D.v;save()}
 else if(a==='fl'){UI.fillLv=+D.v}
 else if(a==='fillall'){const ac=actsFor(UI.evG).find(x=>x.id===UI.evA);const L=UI.fillLv||3;(S.roster[UI.evG]||[]).forEach((n,si)=>{const key=UI.evG+'|'+ac.id+'|'+si;const sc=S.scores[key]=S.scores[key]||{};ac.inds.forEach((x,i)=>{if(!sc[i])sc[i]=L})});save()}
 else if(a==='fillcol'){const ac=actsFor(UI.evG).find(x=>x.id===UI.evA);const L=UI.fillLv||3;(S.roster[UI.evG]||[]).forEach((n,si)=>{const key=UI.evG+'|'+ac.id+'|'+si;const sc=S.scores[key]=S.scores[key]||{};sc[+D.i]=L});save()}
 else if(a==='cyc'){const ac=actsFor(UI.evG).find(x=>x.id===UI.evA);const key=UI.evG+'|'+ac.id+'|'+D.s;const sc=S.scores[key]=S.scores[key]||{};const c=sc[+D.i]||0;if(c>=ac.lv.length)delete sc[+D.i];else sc[+D.i]=c+1;save()}
 else if(a==='half'){const key=UI.evG+'|'+UI.evA+'|'+D.s;const sc=S.scores[key]=S.scores[key]||{};sc.h=!sc.h;save()}
 else if(a==='saveroster'){const t=document.getElementById('rost').value.split('\n').map(x=>x.trim()).filter(Boolean);S.roster[D.g]=t;UI.editG=null;save()}
 else if(a==='editroster')UI.editG=D.g;
 else if(a==='clearscores'){Object.keys(S.scores).filter(k=>k.startsWith(D.g+'|'+D.id+'|')).forEach(k=>delete S.scores[k]);save()}
 else if(a==='copynotas'){
   const acts=actsFor(UI.evG);const ac=acts.find(x=>x.id===UI.evA);
   const txt=(S.roster[UI.evG]||[]).map((n,i)=>{const g=grade(UI.evG,ac,i);return n+'\t'+(g==null?'':String(g).replace('.',','))}).join('\n');
   let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(err){}
   document.getElementById('cpy').innerHTML=ok?'Copiado. Pégalo en Notas o en Séneca.':'No se pudo copiar. Selecciona el texto:<textarea readonly>'+esc(txt)+'</textarea>';return}
 else if(a==='ics'){
   const msg=document.getElementById('icsmsg');const txt=icsText();
   try{const bl=new Blob([txt],{type:'text/calendar'});const url=URL.createObjectURL(bl);const a=document.createElement('a');a.href=url;a.download='clases-cantely.ics';document.body.appendChild(a);a.click();a.remove();msg.textContent='Listo. Ábrelo desde Archivos (o la notificación de descargas) para añadirlo a Calendario.';return}catch(err){}
   msg.innerHTML='Descarga no disponible. Copia este texto en un archivo .ics:<textarea readonly>'+esc(txt)+'</textarea>';return}
 render()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.a==='excf'){excGet(el.dataset.g)[el.dataset.f]=el.value;save();render();return}if(el.dataset.a==='eva'){UI.evA=el.value;UI.evI=0;render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.a==='note'){S.notes[el.dataset.k]=el.value;save()}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
